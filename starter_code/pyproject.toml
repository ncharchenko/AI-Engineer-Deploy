[project]
name = "ai-engineer-deploy"
version = "0.1.0"
description = "A production-ready LLM application with API endpoints, containerization, and cloud deployment capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "python-dotenv",
    "langchain-community",
    "langfuse>=4.0.0",
    "qdrant-client",
    "langchain-qdrant",
    "requests",
    "langchain",
    "langchain-redis>=0.2.5",
    "redis>=7.4.0",
    "nemoguardrails>=0.22.0",
    "fastapi",
    "uvicorn",
    "pydantic"
]

[dependency-groups]
dev = []
